[advisories]
ignore = [
  # rsa e usado apenas para verificacao publica de assinaturas JWT RSA.
  # Nao ha uso de RsaPrivateKey, assinatura ou decriptacao privada no support-auth.
  "RUSTSEC-2023-0071",
  # bincode 1.3.3 chega por hyphenation/syntect na cadeia Typst/PDF.
  # O advisory e de manutencao, sem upgrade seguro direto neste grafo.
  "RUSTSEC-2025-0141",
  # paste chega por hayagriva/rav1e na cadeia Typst/PDF.
  # O advisory e de manutencao, sem upgrade seguro direto neste grafo.
  "RUSTSEC-2024-0436",
  # yaml-rust chega por syntect na cadeia Typst/PDF.
  # O advisory e de manutencao, sem upgrade seguro direto neste grafo.
  "RUSTSEC-2024-0320",
  # quick-xml vulneravel chega por citationberg/plist na cadeia Typst/PDF.
  # O kernel nao usa NsReader diretamente nestes caminhos; acompanhar upgrade Typst.
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
  # rustybuzz e ttf-parser chegam pela cadeia Typst/PDF/fontes.
  # Sem substituicao segura direta no grafo atual; acompanhar migracao para fontations.
  "RUSTSEC-2026-0206",
  "RUSTSEC-2026-0192",
]
